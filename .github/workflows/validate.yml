name: validate
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate SKILL.md
        run: python tools/validate_skill.py
      - name: Compile scan script
        run: python -m py_compile skills/tech-blocker-radar/scripts/tech_scan.py